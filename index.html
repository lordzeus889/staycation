<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="./src/style.css"
    />
    <title>Staycation.</title>
  </head>
  <body
    class="font-poppins px-4 md:px-0"
  >
    <main>
      <header
        class="container hidden mx-auto py-4 md:flex justify-between"
      >
        <div>
          <p
            class="font-medium text-[25px] leading-[100%] text-secondary"
          >
            Stay<span
              class="text-primary"
              >cation</span
            >
          </p>
        </div>
        <div>
          <nav
            class="flex items-center space-x-10 list-none text-primary text-base font-normal"
          >
            <li class="text-secondary">
              Home
            </li>
            <li>Browse by</li>
            <li>Stories</li>
            <li>Agents</li>
          </nav>
        </div>
      </header>

      <section
        class="container mx-auto mt-16 px-4 lg:px-0 py-10"
      >
      <div
  class="flex flex-col-reverse md:flex-row items-center gap-10 lg:gap-40 lg:gap-[64px]"
>
          <!-- hero content -->
         <div
  class="flex flex-col w-full md:w-[514px] shrink-0 gap-10 px-8 md:px-0"
>
            <h1
              class="font-bold text-[30px] md:text-[42px] text-primary leading-[150%]"
            >
              Forget Your Main Work,
              Start Holiday Now!
            </h1>
            <p
              class="font-light leading-[170%] text-dark/10 text-lg"
            >
              We provide you what you
              need to enjoy your holiday
              with family. Time to make
              another memorable moments.
            </p>
            <button
              class="bg-secondary w-55 h-[58.44px] text-white rounded-lg hover:bg-primary"
            >
              Show Me Now
            </button>

            <div
              class="mt-16 flex items-center gap-10 w-117"
            >
              <div class="space-y-4">
                <img
                  src="./src/assets/ic_cities.png"
                  alt="ic_cities"
                  class="object-cover size-8"
                />
                <p
                  class="font-medium text-primary leading-[170%]"
                >
                  80,409
                  <span
                    class="text-light font-light"
                    >travelers</span
                  >
                </p>
              </div>
              <div class="space-y-4">
                <img
                  src="./src/assets/ic_cities.png"
                  alt="ic_cities"
                  class="object-cover size-8"
                />
                <p
                  class="font-medium text-primary leading-[170%]"
                >
                  1492
                  <span
                    class="text-light font-light"
                    >cities</span
                  >
                </p>
              </div>

              <div class="space-y-4">
                <img
                  src="./src/assets/item.png"
                  alt="ic_cities"
                  class="object-cover size-8"
                />
                <p
                  class="font-medium text-primary leading-[170%]"
                >
                  862
                  <span
                    class="text-light font-light"
                    >treasures</span
                  >
                </p>
              </div>
            </div>
          </div>

<!-- Hero image -->
<div class="relative w-full md:w-[559px] shrink-0">
 

  <!-- Main image -->
  <img
    src="./src/assets/picture.png"
    alt="Holiday destination"
    class="relative z-10 block w-full h-auto lg:h-[456px] object-cover rounded-tl-[100px] rounded-tr-xl rounded-br-xl rounded-bl-none"
  />
</div>

        </div>

      
      </section>


     

<section class="container mx-auto px-4 py-20">
  <!-- Places heading -->
  <div class="my-10">
    <h2 class="mb-5 text-primary leading-none font-medium text-2xl">
      Most Picked
    </h2>
  </div>

  
<!-- Places layout -->
<div class="flex flex-col md:flex-row gap-8 lg:gap-14">

  <!-- Main beach card: 380 × 460 -->
  <div class="w-full md:w-[360px] h-auto shrink-0">
    <img
      src="./src/assets/featured.png"
      alt="Beach"
      class="w-full h-full object-cover rounded-2xl"
    />
  </div>

  <!-- Other four cards fill remaining space -->
  <div class="flex-1 min-w-0 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-7">

    <!-- Card 1 -->
    <div class="w-full h-auto">
      <img
        src="./src/assets/Montigo.png"
        alt="Montigo resort"
        class="w-full h-full object-cover rounded-xl"
      />
    </div>

    <!-- Card 2 -->
    <div class="w-full h-auto">
      <img
        src="./src/assets/montana.png"
        alt="Montana Bay"
        class="w-full h-full object-cover rounded-xl"
      />
    </div>

    <!-- Card 3 -->
    <div class="w-full h-auto">
      <img
        src="./src/assets/kalpa.png"
        alt="Kalpa tree"
        class="w-full h-full object-cover rounded-xl"
      />
    </div>

    <!-- Card 4 -->
    <div class="w-full h-auto">
      <img
        src="./src/assets/Caesar.png"
        alt="Caesar Palace"
        class="w-full h-full object-cover rounded-xl"
      />
    </div>

  </div>
</div>

</section>


    </main>
  </body>
</html>
